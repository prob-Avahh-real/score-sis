<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>谱你妹 · Score Sis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#c0c0d8;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow-y:auto}
#app{max-width:560px;margin:0 auto;padding:12px;min-height:100vh}
h1{text-align:center;font-size:24px;font-weight:900;background:linear-gradient(135deg,#ff6080,#ffa040,#40ff80);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2px}
.sub{text-align:center;font-size:11px;color:#404040;margin-bottom:10px}
/* Lesson bar */
.lesson-bar{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}
.ldot{min-width:28px;height:28px;border-radius:50%;background:#1a1a24;border:2px solid#2a2a34;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#404050;cursor:pointer;transition:.2s}
.ldot.active{background:#2a2040;border-color:#6040a0;color:#a080d0}
.ldot.done{background:#1a2a1a;border-color:#20a040;color:#60c080}
/* Content */
#content{background:#0f0f18;border:1px solid#1a1a28;border-radius:12px;padding:14px;margin-bottom:10px;min-height:120px}
#content h2{font-size:17px;color:#a080d0;margin-bottom:6px}
#content p{font-size:13px;color:#808090;line-height:1.6;margin-bottom:8px}
#content .highlight{color:#ffa040;font-weight:700}
/* Piano */
#piano{display:flex;justify-content:center;gap:4px;margin:10px 0;overflow-x:auto;padding:4px 0}
.key{min-width:36px;height:80px;border-radius:0 0 6px 6px;background:#e0e0e0;border:1px solid#aaa;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:10px;font-weight:700;color:#606060;transition:all.1s;position:relative}
.key:active,.key.pressed{background:#a0d0ff;transform:scaleY(.95);box-shadow:0 0 16px rgba(100,160,255,.4)}
.key.black{background:#303030;color:#808080;height:52px;min-width:26px;margin:0 -16px;z-index:1;border-color:#202020}
.key.black:active,.key.black.pressed{background:#4060a0}
.key.highlight{background:#ffd040!important;box-shadow:0 0 16px rgba(255,200,64,.5)}
/* Grid/sequencer */
#grid{display:grid;gap:2px;margin:10px 0}
.grid-row{display:flex;gap:2px}
.grid-cell{width:32px;height:32px;background:#1a1a28;border:1px solid#2a2a34;border-radius:3px;cursor:pointer;transition:.1s}
.grid-cell.on{background:#6040a0;border-color:#8060c0}
.grid-cell.playing{background:#a060e0}
/* Controls */
.ctrl{display:flex;gap:6px;margin:8px 0}
.btn{padding:8px 14px;border-radius:8px;border:1px solid#202030;background:#141420;color:#a0a0b0;font-size:12px;cursor:pointer;flex:1;text-align:center}
.btn.primary{background:linear-gradient(135deg,#6040a0,#402080);border-color:#6040a0;color:#d0c0f0}
.btn:active{transform:scale(.96)}
/* Progress */
#progress{height:3px;background:#1a1a28;border-radius:2px;margin:8px 0}
#progress-bar{height:100%;background:linear-gradient(90deg,#6040a0,#40a0e0);border-radius:2px;transition:width.3s;width:0}
@media(max-width:400px){.key{min-width:28px;height:60px;font-size:8px}.grid-cell{width:24px;height:24px}}
</style>
</head>
<body>
<div id="app">
<h1>谱你妹</h1><p class="sub">—— 零基础学编曲 · 互动式教学 ——</p>
<div class="lesson-bar" id="lessons"></div>
<div id="content"><h2>欢迎</h2><p>选择一节课开始你的音乐之旅 🎵</p></div>
<div id="progress"><div id="progress-bar"></div></div>
<canvas id="staff-canvas" style="width:100%;height:180px;background:#0f0f15;border:1px solid#1a1a28;border-radius:10px;margin:10px 0"></canvas>
<div class="ctrl" id="controls"></div>
<div id="piano" style="margin-top:4px"></div>
</div>
<script>
// ==================== AUDIO ENGINE ====================
let aCtx;function initAudio(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)}

function playNote(note,time,dur=.4){
  if(!aCtx)return;const t=time||aCtx.currentTime;
  const f=440*Math.pow(2,(note-69)/12);const osc=aCtx.createOscillator();const gain=aCtx.createGain();
  osc.type="triangle";osc.frequency.value=f;gain.gain.setValueAtTime(.3,t);gain.gain.exponentialRampToValueAtTime(.001,t+dur);
  const filter=aCtx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=f*4;filter.Q.value=1;
  osc.connect(filter);filter.connect(gain);gain.connect(aCtx.destination);osc.start(t);osc.stop(t+dur+.05)
}

// ==================== LESSONS ====================
const NOTE_NAMES=["C","D","E","F","G","A","B"];
const LESSONS=[
  {id:1,title:"认识音符",desc:"点击下方琴键听听看。五线谱上不同<span class='highlight'>位置</span>代表不同音高。试试点击谱面上的位置！",goal:3,notes:[60,64,67,72],staffNotes:[60,64,67,72]},
  {id:2,title:"节奏入门",desc:"音符有不同的<span class='highlight'>时值</span>。点击五线谱添加四分音符和八分音符，然后播放听听节奏变化。",goal:4,segs:8,notes:[60],staffNotes:[60]},
  {id:3,title:"音阶魔法",desc:"弹一遍<span class='highlight'>C大调音阶</span>（Do Re Mi Fa Sol La Si Do）。看它们在五线谱上如何排列——像楼梯一样逐级上升！",goal:8,notes:[60,62,64,65,67,69,71,72],staffNotes:[60,62,64,65,67,69,71,72]},
  {id:4,title:"和弦初探",desc:"在五线谱上同时放三个音符就形成了<span class='highlight'>和弦</span>。试试C大三和弦（C-E-G）在谱面上的样子。",goal:3,notes:[60,64,67,65,69,72,67,71,74],staffNotes:[60,64,67]},
  {id:5,title:"和弦进行",desc:"经典<span class='highlight'>I→IV→V→I</span>进行。观察和弦在谱面上如何移动——每个和弦就像一句话。",goal:3,notes:[60,65,67],staffNotes:[60,65,67]},
  {id:6,title:"写条旋律",desc:"在五线谱上点出你的第一条<span class='highlight'>旋律</span>！点击谱面不同位置放置音符，然后播放听听你的创作。",goal:5,segs:16,notes:[60,62,64,65,67,69,71,72],staffNotes:[60,62,64,65,67,69,71,72]},
  {id:7,title:"叠层魔法",desc:"音乐是多层的！添加<span class='highlight'>低音声部</span>伴奏（低音谱号）和<span class='highlight'>旋律声部</span>（高音谱号）。",goal:6,segs:8,layers:2,notes:[[48,50,52,53],[64,65,67,69]],staffNotes:[[48,50,52],[64,65,67,69]]},
  {id:8,title:"完成你的第一首曲子",desc:"自由创作 16 拍的旋律！你已经是半个<span class='highlight'>音乐制作人</span>了 🎉<br>试试写出能哼唱的旋律吧！",goal:8,segs:16,notes:[60,62,64,65,67,69,71,72],staffNotes:[60,62,64,65,67,69,71,72]},
];

// ==================== STAFF NOTATION ====================
const staffCanvas=document.getElementById("staff-canvas"),sctx=staffCanvas.getContext("2d");
let staffNotes=[],curLesson=-1,progress=0,seqData=[];
const STAFF_LEFT=40,STAFF_RIGHT_RATIO=.9,LINE_SPACING=10,NOTE_R=7;

function resizeStaff(){const w=staffCanvas.offsetWidth;staffCanvas.width=w;staffCanvas.height=180;if(curLesson>=0)drawStaff()}
window.addEventListener("resize",resizeStaff);

// MIDI note → y position on treble staff (C4=60 = middle C, 1 ledger line below)
function noteToY(note){return 80-(note-60)*LINE_SPACING/2}
function yToNote(y){return Math.round(60+(80-y)*2/LINE_SPACING)}

function drawStaff(){
  const W=staffCanvas.width,H=staffCanvas.height;sctx.clearRect(0,0,W,H);
  // Staff lines (treble: E4 F4 G4 A4 B4 C5 = lines from bottom)
  const staffY=80;
  for(let i=0;i<5;i++){const y=staffY+(-2+i)*LINE_SPACING;sctx.strokeStyle="#404050";sctx.lineWidth=1;sctx.beginPath();sctx.moveTo(STAFF_LEFT,y);sctx.lineTo(W*STAFF_RIGHT_RATIO,y);sctx.stroke()}
  // Clef
  sctx.fillStyle="#606080";sctx.font="bold 70px serif";sctx.fillText("𝄞",STAFF_LEFT-4,staffY+75);
  // Ledger line for middle C
  sctx.strokeStyle="#404050";sctx.beginPath();const cY=noteToY(60);sctx.moveTo(STAFF_LEFT-10,cY);sctx.lineTo(STAFF_LEFT+16,cY);sctx.stroke();
  // Staff notes (user-placed)
  staffNotes.forEach(n=>{const nx=STAFF_LEFT+20+n.seg*((W*STAFF_RIGHT_RATIO-STAFF_LEFT-20)/Math.max(n.totalSegs||8,1));const ny=noteToY(n.note);
    sctx.fillStyle=n.playing?"#ffa040":"#c0a0e0";sctx.beginPath();const tilt=Math.PI/6;
    sctx.ellipse(nx,ny,NOTE_R,NOTE_R*.7,tilt,0,Math.PI*2);sctx.fill();
    sctx.strokeStyle="#8060c0";sctx.stroke();
    if(n.note<60){sctx.strokeStyle="#404050";sctx.beginPath();sctx.moveTo(nx-8,ny);sctx.lineTo(nx+8,ny);sctx.stroke()}
    // Stem
    sctx.strokeStyle="#8060c0";sctx.lineWidth=1.5;sctx.beginPath();sctx.moveTo(nx+6,ny-10);sctx.lineTo(nx+6,ny-25);sctx.stroke()})
  // Suggested notes (ghost)
  const l=LESSONS[curLesson];if(!l)return;const sugg=l.staffNotes;if(!sugg)return;const flat=Array.isArray(sugg[0])?sugg.flat():sugg;
  flat.forEach((n,i)=>{const nx=STAFF_LEFT+20+i*((W*STAFF_RIGHT_RATIO-STAFF_LEFT-20)/Math.max(flat.length,1));const ny=noteToY(n);
    sctx.fillStyle="#ffffff10";sctx.beginPath();sctx.ellipse(nx,ny,NOTE_R,NOTE_R*.7,Math.PI/6,0,Math.PI*2);sctx.fill()})
}

staffCanvas.addEventListener("click",e=>{
  if(curLesson<0)return;const rect=staffCanvas.getBoundingClientRect();const x=e.clientX-rect.left,y=e.clientY-rect.top;
  if(x<STAFF_LEFT||x>staffCanvas.width*STAFF_RIGHT_RATIO)return;
  const note=yToNote(y);if(note<48||note>84)return;
  const l=LESSONS[curLesson];const totalSegs=l.segs||8;const seg=Math.floor((x-STAFF_LEFT-20)/((staffCanvas.width*STAFF_RIGHT_RATIO-STAFF_LEFT-20)/totalSegs));
  initAudio();playNote(note);staffNotes.push({note,seg:Math.max(0,Math.min(seg,totalSegs-1)),totalSegs,playing:false});handleInput(note);drawStaff()});

function loadLesson(idx){
  curLesson=idx;const l=LESSONS[idx];progress=0;staffNotes=[];seqData=[];
  document.getElementById("content").innerHTML=`<h2>第${l.id}课 · ${l.title}</h2><p>${l.desc}</p>`;
  document.getElementById("progress-bar").style.width="0%";
  buildPiano(l.notes);buildControls(l);resizeStaff();drawStaff();
  document.querySelectorAll(".ldot").forEach((d,i)=>d.classList.toggle("active",i===idx))}

function buildPiano(notes){
  const p=document.getElementById("piano");p.innerHTML="";const flat=Array.isArray(notes[0])?notes.flat():notes;const start=Math.min(...flat)-2;
  for(let n=start;n<start+12;n++){const isBlack=[1,3,6,8,10].includes(n%12);const k=document.createElement("div");
    k.className="key"+(isBlack?" black":"");k.textContent=NOTE_NAMES[n%12];if(flat.includes(n))k.classList.add("highlight");
    k.onclick=()=>{initAudio();playNote(n);handleInput(n);staffNotes.push({note:n,seg:staffNotes.length,totalSegs:LESSONS[curLesson]?.segs||8,playing:false});drawStaff()};p.appendChild(k)}}

function buildControls(l){
  const c=document.getElementById("controls");c.innerHTML="";
  if(l.segs){c.innerHTML+=`<button class="btn primary" onclick="playStaff()">▶ 播放</button><button class="btn" onclick="staffNotes=[];drawStaff()">✕ 清空</button>`}
  if(curLesson>0)c.innerHTML+=`<button class="btn" onclick="loadLesson(curLesson-1)">◀</button>`;
  if(curLesson<LESSONS.length-1)c.innerHTML+=`<button class="btn primary" onclick="loadLesson(curLesson+1)">▶</button>`;
  if(curLesson===LESSONS.length-1)c.innerHTML+=`<button class="btn" style="background:linear-gradient(135deg,#ffa040,#ff6040);color:#fff" onclick="loadLesson(0)">🎉 重来</button>`}

function handleInput(note){if(curLesson<0)return;const l=LESSONS[curLesson];progress++;const pct=Math.min(progress/l.goal*100,100);
  document.getElementById("progress-bar").style.width=pct+"%";
  if(progress>=l.goal){document.querySelectorAll(".ldot")[curLesson].classList.add("done");if(curLesson<LESSONS.length-1)setTimeout(()=>loadLesson(curLesson+1),1200)}}

function playStaff(){if(!aCtx||staffNotes.length===0)return;initAudio();const sorted=[...staffNotes].sort((a,b)=>a.seg-b.seg);
  let i=0;const timer=setInterval(()=>{if(i>=sorted.length||i>=20){clearInterval(timer);staffNotes.forEach(n=>n.playing=false);drawStaff();return}
    const n=sorted[i];n.playing=true;playNote(n.note,0,.3);drawStaff();setTimeout(()=>{n.playing=false;drawStaff()},250);i++},400);}

// Init
const lb=document.getElementById("lessons");LESSONS.forEach((l,i)=>{const d=document.createElement("div");d.className="ldot";d.textContent=i+1;d.onclick=()=>loadLesson(i);lb.appendChild(d)});loadLesson(0);
</script>
</body>
</html>
